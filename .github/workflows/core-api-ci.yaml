name: Build and Deploy via GitOps

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "cmd/**"
      - "pkg/**"
      - "internal/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "openapi.yaml"
      - ".env.example"
      - "build/flutter-build.Dockerfile"
      - "build/build-image.sh"
      - "tests/postman/**"
      - "docs/**"
      - "Makefile"

  pull_request:
    branches: ["main", "dev"]
    paths:
      - "cmd/**"
      - "pkg/**"
      - "internal/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "openapi.yaml"
      - "tests/postman/**"
      - "docs/**"
      - "Makefile"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── 1. Tests API (Postman / Newman) ────────────────────────────────────────
  test:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into .env.ci
        run: |
          sed -i "s|ACCESS_TOKEN_SECRET=.*|ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET || 'ci-access-secret-32chars-minimum!' }}|" .env.ci
          sed -i "s|REFRESH_TOKEN_SECRET=.*|REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET || 'ci-refresh-secret-32chars-minimum!' }}|" .env.ci
          sed -i "s|SECRETS_ENCRYPTION_KEY=.*|SECRETS_ENCRYPTION_KEY=${{ secrets.SECRETS_ENCRYPTION_KEY || 'Y2ktc2VjcmV0cy1lbmNyeXB0aW9uLWtleS0zMmJ5dGU=' }}|" .env.ci

      - name: Start CI stack
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for core-api
        run: |
          echo "Waiting for core-api on :8080..."
          timeout 90 bash -c '
            until curl -sf http://localhost:8080/healthz > /dev/null 2>&1; do
              echo "  ...not ready yet"; sleep 3
            done
          '
          echo "✅ core-api ready"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman tests
        run: |
          mkdir -p tests/postman/results
          newman run tests/postman/flotio-api.postman_collection.json \
            --environment tests/postman/flotio-ci.postman_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export tests/postman/results/report.html \
            --reporter-htmlextra-title "Flotio API — ${{ github.ref_name }} #${{ github.run_number }}" \
            --reporter-htmlextra-logs \
            --timeout-request 10000 \
            --bail

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-report-${{ github.run_number }}
          path: tests/postman/results/report.html
          retention-days: 30

      - name: Stop CI stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ── 2. Build & Push image Docker ───────────────────────────────────────────
  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        if: github.event_name == 'push'
        run: |
          latest=$(git tag --sort=-v:refname | head -n 1)

          if [[ -z "$latest" ]]; then
            latest="0.0"
          fi

          major=$(echo $latest | cut -d. -f1)
          minor=$(echo $latest | cut -d. -f2)

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            major=$((major + 1))
            minor=0
          else
            minor=$((minor + 1))
          fi

          new="$major.$minor"
          echo "version=$new" >> $GITHUB_OUTPUT

      - name: Create Git tag
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}

  # ── 3. Update GitOps repo ──────────────────────────────────────────────────
  update-gitops:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: flotio-dev/k8s_config
          token: ${{ secrets.K8S_CONFIG_REPO_TOKEN }}
          fetch-depth: 0

      - name: Update deployment
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            FILE="manifest/prod/core-api/deploy-core-api.yaml"
          else
            FILE="manifest/dev/core-api/deploy-core-api.yaml"
          fi

          sed -i "s|image: .*|image: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}|g" $FILE

      - name: Commit & push
        run: |
          git config user.email "actions@github.com"
          git config user.name "ArgoCD Sync Bot"
          git add manifest
          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi
          git commit -m "Deploy version ${{ needs.build.outputs.version }}"
          git push origin HEAD:main

  # ── 4. Swagger spec drift check (D3 / AC-19 / AC-20) ─────────────────────
  # Regenerates docs/api with the pinned swag CLI (v1.16.6) and fails the
  # pipeline on any diff. NOTE: swag v1.16.6's version.go const still reports
  # "v1.16.4" (upstream quirk); the pinned install and generation behavior are
  # v1.16.6.
  swagger-check:
    name: Swagger Spec Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Install pinned swag CLI (v1.16.6, patched for '@' in router paths)
        run: make swagger-install

      - name: Verify pinned swag module resolves to v1.16.6 (AC-19)
        run: go list -m github.com/swaggo/swag | grep -F "v1.16.6"

      - name: Regenerate spec
        run: make swagger

      - name: Fail on spec drift
        run: |
          if ! git diff --exit-code -- docs/api; then
            echo "::error::docs/api is out of date — run 'make swagger' and commit docs/api/"
            exit 1
          fi

      - name: Run swagger contract tests
        run: go test ./internal/api/ -run TestSwagger
