      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      line_number:
        type: integer
      timestamp:
        description: Unix timestamp
        type: integer
      updatedAt:
        type: string
    type: object
  github_com_flotio-dev_api_internal_engines_db.Organization:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
