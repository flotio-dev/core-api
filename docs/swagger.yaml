info:
  contact: {}
paths:
  /auth/github/callback:
    get:
      consumes:
      - application/json
      description: Handle GitHub OAuth callback and redirect to frontend
      parameters:
      - description: Authorization code from GitHub
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: GitHub OAuth callback
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with username and password
      parameters:
      - description: User login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Get the authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Update the authenticated user's profile information
      parameters:
      - description: User update data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.StatusResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update current user profile
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token
      parameters:
      - description: Refresh token
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with username, email, and password
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /github:
    get:
      consumes:
      - application/json
      description: Handle GitHub OAuth login and related actions
      parameters:
      - description: Action to perform (login, callback)
        in: query
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.GithubLoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: GitHub OAuth actions
      tags:
      - auth
  /github/disconnect:
    delete:
      description: Supprime l'enregistrement `GithubInstallation` de l'utilisateur
        courant et tente de supprimer l'installation via l'API GitHub
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.APIErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Déconnecte l'utilisateur courant de GitHub
      tags:
      - github
  /github/installation:
    get:
      description: Retourne l'enregistrement GithubInstallation correspondant à installation_id
        si présent
      parameters:
      - description: Installation ID
        in: query
        name: installation_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.GithubInstallationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.APIErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Vérifie l'existence d'une installation GitHub par installation_id
      tags:
      - github
  /github/installations:
    get:
      description: Retourne l'installation GitHub liée à l'utilisateur authentifié
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.GithubInstallationResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Vérifie si l'utilisateur a une installation GitHub
      tags:
      - github
  /github/post-installation:
    post:
      consumes:
      - application/json
      description: Reçoit l'ID d'installation GitHub et l'associe à l'utilisateur
        actuel
      parameters:
      - description: Installation payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_flotio-dev_api_internal_models.PostInstallationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.PostInstallationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Enregistre ou met à jour une installation GitHub pour l'utilisateur
        authentifié
      tags:
      - github
  /github/pubspec-path:
    get:
      description: Parcourt le repo pour renvoyer le path du pubspec.yaml (utilisé
        pour déterminer build folder)
      parameters:
      - description: Owner du repo
        in: query
        name: owner
        required: true
        type: string
      - description: Nom du repo
        in: query
        name: repo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.APIErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Trouve le chemin de pubspec.yaml dans un repo
      tags:
      - github
  /github/repo:
    get:
      description: Retourne l'arborescence complète des dossiers d'un dépôt GitHub
      parameters:
      - description: Owner du repo
        in: query
        name: owner
        required: true
        type: string
      - description: Nom du repo
        in: query
        name: repo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.GithubTreeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Récupère l'arborescence d'un repo GitHub
      tags:
      - github
  /github/repos:
    get:
      description: Liste les repos accessibles pour l'installation GitHub de l'utilisateur
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.GithubRepositoriesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_flotio-dev_api_internal_models.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Get GitHub Repositories
      tags:
      - github
  /internal/kubernetes/build/{buildID}/resources:
    delete:
      consumes:
      - application/json
      description: Deletes all Kubernetes resources (Pod, ConfigMap, Secret) associated
        with a build
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: integer
      produces:
      - application/json
