definitions:
  payload.PostInstallationPayload:
    properties:
      installation_id:
        example: 12345678
        type: integer
    type: object
  response.APIErrorResponse:
    properties:
      code:
        description: Code HTTP
        example: 400
        type: integer
      message:
        description: Message optionnel affiché côté client
        example: Bad request
        type: string
      status:
        description: Status logique (InvalidArguments, Unauthorized…)
        example: error
        type: string
    type: object
  response.GithubInstallationResponse:
    properties:
      account_login:
        example: flotio-dev
        type: string
      account_type:
        example: User
        type: string
      id:
        example: 123456
        type: integer
      installation_id:
        example: 987654
        type: integer
      user_id:
        example: 42
        type: integer
    type: object
  response.GithubRepoTreeItem:
    properties:
      children:
        items:
          $ref: '#/definitions/response.GithubRepoTreeItem'
        type: array
      name:
        example: cmd
        type: string
      path:
        example: cmd/service
        type: string
      type:
        example: dir
        type: string
      url:
        example: https://github.com/...
        type: string
    type: object
  response.GithubRepositoriesResponse:
    properties:
      repositories:
        items:
          $ref: '#/definitions/response.GithubRepository'
        type: array
    type: object
  response.GithubRepository:
    properties:
      full_name:
        example: flotio-dev/api
        type: string
      id:
        example: 123456
        type: integer
      name:
        example: api
        type: string
      owner:
        example: flotio-dev
        type: string
      private:
        example: false
        type: boolean
    type: object
  response.GithubTreeResponse:
    properties:
      owner:
        example: flotio-dev
        type: string
      repo:
        example: api
        type: string
      tree:
        items:
          $ref: '#/definitions/response.GithubRepoTreeItem'
        type: array
    type: object
  response.PostInstallationResponse:
    properties:
      installation_id:
        example: 12345678
        type: integer
    type: object
info:
  contact: {}
paths:
  /github/installations:
    get:
      description: Retourne l'installation GitHub liée à l'utilisateur authentifié
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.GithubInstallationResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Vérifie si l'utilisateur a une installation GitHub
      tags:
      - github
  /github/post-installation:
    post:
      consumes:
      - application/json
      description: Reçoit l'ID d'installation GitHub et l'associe à l'utilisateur
        actuel
      parameters:
      - description: Installation payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/payload.PostInstallationPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PostInstallationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Enregistre ou met à jour une installation GitHub pour l'utilisateur
        authentifié
      tags:
      - github
  /github/repo:
    get:
      description: Retourne l'arborescence complète des dossiers d'un dépôt GitHub
      parameters:
      - description: Owner du repo
        in: query
        name: owner
        required: true
        type: string
      - description: Nom du repo
        in: query
        name: repo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.GithubTreeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Récupère l'arborescence d'un repo GitHub
      tags:
      - github
  /github/repos:
    get:
      description: Liste les repos accessibles pour l'installation GitHub de l'utilisateur
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.GithubRepositoriesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Get GitHub Repositories
      tags:
      - github
securityDefinitions:
  BearerAuth:
    description: Type "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
