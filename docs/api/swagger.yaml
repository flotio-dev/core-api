info:
  contact:
    email: support@flotio.dev
    name: Flotio Team
  description: Flotio Core API — authentication, environment/keystore/Google Play
    credentials assets, projects, build pipeline, releases and GitHub integration
    for the Flotio mobile CI platform.
  license:
    name: Proprietary
  title: Flotio Core API
  version: 1.0.0
paths:
  /auth/@me:
    get:
      description: Return information about the authenticated user
      operationId: MeGetHandler
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_flotio-dev_core-api_internal_modules_user_model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/APIErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Update email and/or username of the authenticated user
      operationId: MePutHandler
      parameters:
      - description: User update payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/github_com_flotio-dev_core-api_internal_modules_user_model.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_flotio-dev_core-api_internal_modules_user_model.StatusResponse'
        "400":
          description: Bad Request
